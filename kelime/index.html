<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eFAM English</title>
<meta name="description" content="eFAM English: aralıklı tekrar ile 5000 temel İngilizce kelime. İlerleme yalnızca cihazda saklanır.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171C19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="eFAM English">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:'Bricolage Grotesque';font-weight:700;font-display:swap;src:url(../bricolage-grotesque-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Bricolage Grotesque';font-weight:700;font-display:swap;src:url(../bricolage-grotesque-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA}
@font-face{font-family:'Bricolage Grotesque';font-weight:500;font-display:swap;src:url(../bricolage-grotesque-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Bricolage Grotesque';font-weight:500;font-display:swap;src:url(../bricolage-grotesque-latin-ext-500-normal.woff2) format('woff2');unicode-range:U+0100-02BA}
@font-face{font-family:'Figtree';font-weight:400;font-display:swap;src:url(../figtree-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Figtree';font-weight:400;font-display:swap;src:url(../figtree-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA}
@font-face{font-family:'Figtree';font-weight:600;font-display:swap;src:url(../figtree-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Figtree';font-weight:600;font-display:swap;src:url(../figtree-latin-ext-600-normal.woff2) format('woff2');unicode-range:U+0100-02BA}
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --ink:#131A16; --muted:#5A645E; --line:#D7DDD9;
  --accent:#17795A; --accent-soft:#DCEFE6; --on-accent:#FFFFFF;
  --good:#1D7F52; --good-soft:#DDF1E6; --warn:#9A6210; --warn-soft:#F8ECD6; --bad:#B9372F; --bad-soft:#F7E0DE;
  --l1:#9FD3BC; --l2:#5DB394; --l3:#17795A;
  --scrim:rgba(10,16,13,.45);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1210; --surface:#171C19; --ink:#E7ECE9; --muted:#97A39C; --line:#27302B;
  --accent:#4FCB9A; --accent-soft:#16291F; --on-accent:#0E1210;
  --good:#4CC38A; --good-soft:#15291F; --warn:#E3A944; --warn-soft:#2B2213; --bad:#F0716A; --bad-soft:#2E1718;
  --l1:#2C5A47; --l2:#3A9472; --l3:#4FCB9A;
  --scrim:rgba(0,0,0,.6); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E1210; --surface:#171C19; --ink:#E7ECE9; --muted:#97A39C; --line:#27302B;
  --accent:#4FCB9A; --accent-soft:#16291F; --on-accent:#0E1210;
  --good:#4CC38A; --good-soft:#15291F; --warn:#E3A944; --warn-soft:#2B2213; --bad:#F0716A; --bad-soft:#2E1718;
  --l1:#2C5A47; --l2:#3A9472; --l3:#4FCB9A;
  --scrim:rgba(0,0,0,.6); color-scheme:dark; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 92px)}
/* üst çubuk: logo + menü */
.appbar{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.appbar-in{max-width:560px;margin:0 auto;height:64px;padding:0 12px 0 16px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:11px;flex:1;min-width:0;text-align:left}
.mark{flex:none;width:44px;height:44px;border-radius:13px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.04em;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14)}
.word{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.word b{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.word span{font-family:var(--display);font-weight:500;font-size:14px;color:var(--accent);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.menubtn{flex:none;width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--bg)}
.menubtn svg{width:24px;height:24px}
.menubtn[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
.menu-bg{position:fixed;inset:0;z-index:15;background:var(--scrim)}
.menu{position:fixed;z-index:16;top:calc(env(safe-area-inset-top) + 70px);right:max(10px, calc((100vw - 560px)/2 + 10px));width:min(300px, calc(100vw - 20px));background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:0 18px 48px rgba(0,0,0,.18)}
.menu .mhead{display:flex;align-items:center;gap:10px;padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu .mhead .mark{width:36px;height:36px;font-size:17px;border-radius:11px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 10px;border-radius:12px;font-weight:600;font-size:15.5px;text-align:left}
.menu button svg{width:22px;height:22px;flex:none;color:var(--muted)}
.menu button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.menu button[aria-current="page"] svg{color:var(--accent)}
.menu button .r{margin-left:auto;font-weight:500;font-size:13px;color:var(--muted)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.top{display:flex;align-items:center;justify-content:space-between;margin:2px 0 16px}
.top h1{font-size:26px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font-size:17px;margin-bottom:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.hero .big{font-family:var(--display);font-size:52px;line-height:1;font-weight:700}
.hero .of{font-size:18px;color:var(--muted);font-weight:500;font-family:var(--display)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;display:flex;margin-top:12px}
.bar i{display:block;height:100%}
.row{display:flex;gap:10px}
.row>*{flex:1}
.tile{background:var(--bg);border-radius:14px;padding:12px}
.tile b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.tile span{font-size:12.5px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.45}
.btn+.btn{margin-top:10px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lvl{margin-top:12px}
.lvl .lh{display:flex;justify-content:space-between;font-size:13.5px}
.lvl .bar{height:8px;margin-top:6px}
.cols{display:flex;align-items:flex-end;gap:4px;height:110px;margin-top:6px}
.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.cols i{display:block;width:100%;max-width:22px;border-radius:4px 4px 0 0;background:var(--accent);min-height:2px}
.cols i.z{background:var(--line)}
.cols span{font-size:10.5px;color:var(--muted);margin-top:4px}
.stages{display:flex;gap:6px;margin-top:4px}
.stages div{flex:1;text-align:center;background:var(--bg);border-radius:12px;padding:9px 2px}
.stages b{display:block;font-family:var(--display);font-size:19px}
.stages span{font-size:11px;color:var(--muted)}
/* kelime listesi */
.search{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:8px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .w{font-weight:600}
.item .t{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m{flex:1;min-width:0}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.learning{background:var(--warn)}
.dot.learned{background:var(--good)}
.tag{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--bg);color:var(--muted)}
/* ayarlar */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set select{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px}
.set input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.prose p{margin:0 0 10px}
.prose ol{margin:0 0 10px;padding-left:20px}
/* çalışma ekranı */
.study{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto}
.study .tile{background:var(--surface);border:1px solid var(--line)}
.study .wrap{padding-bottom:calc(env(safe-area-inset-bottom) + 24px);min-height:100%;display:flex;flex-direction:column}
.shead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.shead .bar{flex:1;margin:0;height:8px}
.close{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line)}
.qkind{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.qword{font-family:var(--display);font-size:38px;line-height:1.1;font-weight:700;word-break:break-word}
.qtr{font-family:var(--display);font-size:26px;line-height:1.2;font-weight:500}
.qsent{font-size:20px;line-height:1.5}
.blank{display:inline-block;min-width:80px;border-bottom:2.5px solid var(--accent);margin:0 2px}
.hint{margin-top:10px;color:var(--muted)}
.mask{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.mask span{width:30px;height:40px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:21px;font-weight:700}
.mask span.h{background:transparent;border-style:dashed;color:var(--muted)}
.mask span.sp{width:12px;border:0;background:transparent}
.choices{display:grid;gap:10px;margin-top:22px}
.choice{min-height:56px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);padding:10px 14px;text-align:left;font-size:16.5px;font-weight:500}
.choice.ok{border-color:var(--good);background:var(--good-soft)}
.choice.no{border-color:var(--bad);background:var(--bad-soft)}
.answer{width:100%;height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px;font-size:20px;margin-top:22px}
.answer:focus{outline:none;border-color:var(--accent)}
.answer.ok{border-color:var(--good);background:var(--good-soft)}
.answer.no{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:16px;padding:14px 16px;margin-top:16px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)} .fb.mid{background:var(--warn-soft)}
.fb .ft{font-weight:700;margin-bottom:4px}
.fb.ok .ft{color:var(--good)} .fb.no .ft{color:var(--bad)} .fb.mid .ft{color:var(--warn)}
.ex{margin-top:8px;font-size:15px}
.ex mark{background:none;color:inherit;font-weight:700;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px}
.say{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);vertical-align:middle;flex:none}
.say svg{width:20px;height:20px}
.grow{flex:1}
.actions{margin-top:20px}
.textlink{display:block;margin:14px auto 0;color:var(--muted);font-weight:600;font-size:14px;padding:8px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--accent-soft);color:var(--accent)}
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:88vh;overflow-y:auto}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;max-width:90vw}
.center{text-align:center}
.celebrate{font-size:54px;line-height:1;margin:10px 0}
</style>
</head>
<body>
<header class="appbar"><div class="appbar-in">
  <button class="logo" id="logo" aria-label="eFAM English ana sayfa"><span class="mark" aria-hidden="true">eF</span><span class="word"><b>eFAM</b><span lang="en">English</span></span></button>
  <button class="menubtn" id="menubtn" aria-label="Menü" aria-expanded="false" aria-haspopup="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div></header>
<div class="wrap" id="main">
  <div class="top"><h1 id="title">Bugün</h1><span class="pill" id="streak" title="Seri"></span></div>
  <div id="view"><p class="muted">Kelimeler yükleniyor…</p></div>
</div>
<nav class="tabs" aria-label="Bölümler">
  <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v15H6.5A2.5 2.5 0 0 0 4 20.5 2.5 2.5 0 0 0 6.5 23H19"/><path d="M9 8h6M9 12h4"/></svg>Çalış</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>İlerleme</button>
  <button data-tab="words"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Kelimeler</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ayarlar</button>
</nav>
<div class="study" id="study" hidden><div class="wrap" id="sview"></div></div>

<script>
(function(){
'use strict';
/* ================= sabitler ================= */
const LEVELS = ['A1','A2','B1','B2','C1'];
const LEVEL_NAME = {A1:'Başlangıç',A2:'Temel',B1:'Orta',B2:'Orta üstü',C1:'İleri'};
// Aralıklı tekrar: kelime k. kutudayken bir sonraki soru INTERVALS[k] gün sonra gelir.
// 5. kutudaki (35 gün) sınavı da geçen kelime "öğrenildi" sayılır ve bir daha sorulmaz.
const INTERVALS = [0, 1, 3, 7, 16, 35];
const LEARNED = 6;
const DAY = 86400000;
const POS = {n:'isim',v:'fiil',adj:'sıfat',adv:'zarf',prep:'edat',pron:'zamir',conj:'bağlaç',det:'belirleyici',num:'sayı',int:'ünlem',phr:'kalıp',mv:'yardımcı fiil'};
const KEY = 'kelime5000.v1';
const ICON_SAY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => new Intl.NumberFormat('tr-TR').format(n);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.random()*a.length|0];

/* ================= kelimeler ================= */
let WORDS = [], BY = Object.create(null), BYLEVEL = {};
async function loadWords(){
  const texts = await Promise.all(LEVELS.map(l => fetch('data/'+l+'.txt').then(r => { if(!r.ok) throw new Error(l); return r.text(); })));
  texts.forEach((t,i) => {
    const lv = LEVELS[i]; BYLEVEL[lv] = [];
    for(const line of t.split('\n')){
      const s = line.trim(); if(!s || s[0]==='#') continue;
      const [w,pos,tr,ex] = s.split('|').map(x => (x||'').trim());
      if(!w || !tr || BY[w]) continue;
      const m = ex ? ex.match(/\[([^\]]+)\]/) : null;
      const o = {w, pos, tr, ex: m ? ex : '', form: m ? m[1] : w, lv, i: WORDS.length, m1: tr.split(/[,;]/)[0].trim().toLocaleLowerCase('tr')};
      WORDS.push(o); BY[w] = o; BYLEVEL[lv].push(o);
    }
  });
}

/* ================= durum ================= */
let S;
function defaults(){ return {v:1, p:{}, days:{}, set:{daily:15, round:20, start:'A1', speak:true, theme:'auto'}, created:Date.now()}; }
function load(){
  try{ S = JSON.parse(localStorage.getItem(KEY)); }catch(e){ S = null; }
  if(!S || typeof S!=='object') S = defaults();
  S.set = Object.assign(defaults().set, S.set||{}); S.p = S.p||{}; S.days = S.days||{};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Kaydedilemedi: depolama dolu ya da kapalı'); } }
const pad = n => String(n).padStart(2,'0');
const dayKey = (t=Date.now()) => { const d=new Date(t); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const startOfDay = (t=Date.now()) => { const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const addDays = (t,n) => { const d=new Date(startOfDay(t)); d.setDate(d.getDate()+n); return d.getTime(); };
function dayRec(k=dayKey()){ return S.days[k] || (S.days[k] = {n:0,r:0,c:0,x:0,t:0,L:0}); }
function status(w){ const p=S.p[w]; return !p ? 'new' : p.s>=LEARNED ? 'learned' : 'learning'; }

function dueList(now=Date.now()){
  const out=[];
  for(const o of WORDS){ const p=S.p[o.w]; if(p && p.s<LEARNED && p.d<=now) out.push(o); }
  return out.sort((a,b)=>S.p[a.w].d-S.p[b.w].d);
}
function newOrder(){
  const si = LEVELS.indexOf(S.set.start);
  const lv = LEVELS.slice(si).concat(LEVELS.slice(0,si));
  const out=[]; for(const l of lv) for(const o of BYLEVEL[l]) if(!S.p[o.w]) out.push(o);
  return out;
}
// Günlük yeni kelime sayısı, birikmiş tekrar yüküne göre otomatik kısılır.
function newAllowed(dueCount){
  let n = Math.max(0, S.set.daily - dayRec().n);
  if(dueCount > 150) n = 0;
  else if(dueCount > 80) n = Math.min(n, Math.ceil(S.set.daily/3));
  return n;
}
function counts(){
  let learned=0, learning=0; const st=[0,0,0,0,0,0,0]; const lv={};
  for(const l of LEVELS) lv[l]={t:BYLEVEL[l].length,learned:0,learning:0};
  for(const o of WORDS){ const p=S.p[o.w]; if(!p) continue; if(p.s>=LEARNED){learned++; lv[o.lv].learned++;} else {learning++; lv[o.lv].learning++;} st[Math.min(p.s,6)]++; }
  return {learned, learning, fresh: WORDS.length-learned-learning, st, lv};
}
function streak(){
  let n=0, t=Date.now();
  const has = k => S.days[k] && (S.days[k].r + S.days[k].n) > 0;
  if(!has(dayKey(t))) t = addDays(t,-1);
  while(has(dayKey(t))){ n++; t = addDays(t,-1); }
  return n;
}

/* ------- puanlama (aralıklı tekrar) ------- */
// result: 'good' doğru, 'hard' küçük yazım hatası, 'bad' yanlış
function grade(o, result){
  const now=Date.now(), t=dayRec();
  let p=S.p[o.w];
  if(!p){ p = S.p[o.w] = {s:0,d:now,r:0,c:0,x:0,f:now,l:now}; t.n++; } else t.r++;
  const prev=p.s, elapsed=(now-(p.l||now))/DAY;
  if(result==='good'){
    p.c++; t.c++;
    if(prev===0) p.s=1;
    else{
      p.s = prev+1;
      // Uzun aradan sonra hâlâ hatırlıyorsa bir kutu fazla atlat (en fazla 5. kutuya).
      if(prev>=2 && prev<4 && elapsed >= 2*INTERVALS[prev]) p.s = prev+2;
    }
  } else if(result==='hard'){
    p.c++; t.c++; if(prev===0) p.s=1;
  } else {
    p.x++; t.x++; p.s = Math.max(1, prev-2);
  }
  p.r++; p.l=now;
  if(p.s>=LEARNED){ p.s=LEARNED; p.d=0; p.ld=now; t.L++; save(); return 'learned'; }
  let iv = INTERVALS[p.s];
  if(iv>=7) iv += Math.round((Math.random()*2-1)*iv*0.1); // yığılmayı önlemek için ±%10
  p.d = addDays(now, iv);
  save();
  return p.s>prev ? 'up' : p.s<prev ? 'down' : 'same';
}

/* ================= soru üretimi ================= */
function norm(s){ return String(s).toLowerCase().replace(/[’`´]/g,"'").replace(/[.!?,]+$/,'').replace(/\s+/g,' ').trim(); }
function lev(a,b){
  if(Math.abs(a.length-b.length)>1) return 2;
  const d=[]; for(let i=0;i<=a.length;i++){ d[i]=[i]; } for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
function distractors(o, n, key){
  const seen=new Set([key(o)]), out=[];
  const pools = [WORDS.filter(x=>x.lv===o.lv && x.pos===o.pos), WORDS.filter(x=>x.pos===o.pos), WORDS];
  for(const pool of pools){
    const cand = pool.length>400 ? Array.from({length:80},()=>pick(pool)) : shuffle(pool.slice());
    for(const x of cand){ if(out.length>=n) break; const k=key(x); if(x===o || seen.has(k) || x.m1===o.m1) continue; seen.add(k); out.push(x); }
    if(out.length>=n) break;
  }
  return out;
}
function blankSentence(o){
  return esc(o.ex).replace(/\[[^\]]+\]/, '<span class="blank">&nbsp;</span>');
}
function exampleHtml(o){
  return o.ex ? esc(o.ex).replace(/\[([^\]]+)\]/, '<mark>$1</mark>') : '';
}
function maskWord(w, ratio){
  const letters=[...w]; const idx=[];
  letters.forEach((c,i)=>{ if(i>0 && /[a-z]/i.test(c)) idx.push(i); });
  const hideN = Math.max(1, Math.round(idx.length*ratio));
  const hide = new Set(shuffle(idx).slice(0,hideN));
  return letters.map((c,i)=> c===' ' ? '<span class="sp"></span>' : hide.has(i) ? '<span class="h">_</span>' : '<span>'+esc(c)+'</span>').join('');
}
function qType(o, item){
  const p=S.p[o.w], s=p?p.s:0, hasEx=!!o.ex;
  if(item.retry) return pick(['mc_tr_en','mc_en_tr']);
  if(item.isNew || s===0) return 'mc_en_tr';
  if(s===1) return pick(hasEx ? ['mc_tr_en','mc_tr_en','cloze_mc','mc_en_tr'] : ['mc_tr_en','mc_en_tr']);
  if(s===2) return pick(hasEx ? ['letters','letters','cloze_mc'] : ['letters']);
  if(s===3) return hasEx ? pick(['cloze','cloze','letters']) : 'letters';
  if(s===4) return hasEx ? pick(['cloze','type']) : 'type';
  return hasEx ? pick(['type','cloze_hard']) : 'type';
}
const KIND_LABEL = {mc_en_tr:'Anlamını seç', mc_tr_en:'İngilizcesini seç', cloze_mc:'Boşluğa uyan kelimeyi seç', letters:'Eksik harfleri tamamla', cloze:'Boşluğu doldur', cloze_hard:'Boşluğu doldur', type:'İngilizcesini yaz'};
function makeQ(o, item){
  const type=qType(o,item); const q={type,o};
  const posTag = o.pos && POS[o.pos] ? ' <span class="tag">'+POS[o.pos]+'</span>' : '';
  if(type==='mc_en_tr'){
    q.prompt = '<div class="qword">'+esc(o.w)+'</div><div class="hint">'+posTag+' <button class="say" data-say="'+esc(o.w)+'" aria-label="Dinle">'+ICON_SAY+'</button></div>';
    q.answer = o.tr; q.choices = shuffle([o.tr, ...distractors(o,3,x=>x.tr).map(x=>x.tr)]);
  } else if(type==='mc_tr_en'){
    q.prompt = '<div class="qtr">'+esc(o.tr)+'</div><div class="hint">'+posTag+'</div>';
    q.answer = o.w; q.choices = shuffle([o.w, ...distractors(o,3,x=>x.w).map(x=>x.w)]);
  } else if(type==='cloze_mc'){
    q.prompt = '<div class="qsent">'+blankSentence(o)+'</div><div class="hint">İpucu: '+esc(o.tr)+'</div>';
    q.answer = o.form; q.choices = shuffle([o.form, ...distractors(o,3,x=>x.form.toLowerCase()).map(x=>x.form)]);
  } else if(type==='letters'){
    q.prompt = '<div class="qtr">'+esc(o.tr)+'</div><div class="hint">'+posTag+'</div><div class="mask">'+maskWord(o.w, (S.p[o.w]&&S.p[o.w].s>=4)?0.7:0.5)+'</div>';
    q.answer = o.w; q.input = true; q.ph = 'Kelimenin tamamını yaz';
  } else if(type==='cloze' || type==='cloze_hard'){
    const first = type==='cloze' ? ' · <b>'+esc(o.form[0])+'…</b> ('+o.form.length+' harf)' : '';
    q.prompt = '<div class="qsent">'+blankSentence(o)+'</div><div class="hint">'+esc(o.tr)+first+'</div>';
    q.answer = o.form; q.input = true; q.ph = 'Boşluğa gelen kelime';
  } else {
    q.prompt = '<div class="qtr">'+esc(o.tr)+'</div><div class="hint">'+posTag+'</div>';
    q.answer = o.w; q.input = true; q.ph = 'İngilizcesi';
  }
  return q;
}
function checkTyped(q, raw){
  let a = norm(raw); const o=q.o; const ans = norm(q.answer);
  if(!a) return {r:'bad'};
  const variants = [a, a.replace(/^to /,''), a.replace(/^(a|an|the) /,'')];
  if(variants.includes(ans)) return {r:'good'};
  if(q.type==='cloze' || q.type==='cloze_hard'){ if(variants.includes(norm(o.w)) && norm(o.w)!==ans) return {r:'bad', note:'Kök doğru ama cümlede “'+q.answer+'” biçimi gerekiyor.'}; }
  if(q.type==='type' || q.type==='letters'){
    for(const v of variants){ const syn=BY[v]; if(syn && syn!==o && syn.m1===o.m1) return {r:'good', note:'“'+syn.w+'” de doğru; bu kartın kelimesi “'+o.w+'”.'}; }
  }
  if(ans.length>=5 && variants.some(v=>lev(v,ans)===1)) return {r:'hard', note:'Küçük bir yazım hatası var. Kelime bu tur ilerlemedi, kutusunda kaldı.'};
  return {r:'bad'};
}

function pickVoice(){ if(!('speechSynthesis' in window)) return; const vs=speechSynthesis.getVoices(); voice = vs.find(v=>/en[-_]US/i.test(v.lang) && /Samantha|Google|Natural|Enhanced/i.test(v.name)) || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }

function say(text){
  if(!('speechSynthesis' in window) || !text) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text.replace(/[\[\]]/g,'')); u.lang='en-US'; if(voice) u.voice=voice; u.rate=.92; speechSynthesis.speak(u); }catch(e){}
}

  const q=$('#q');
  q.oninput=()=>{ wf.q=q.value; wf.limit=150; drawList(); };
  $('#lvc').onclick=e=>{ const b=e.target.closest('[data-lv]'); if(!b) return; wf.lv=b.dataset.lv; wf.limit=150; renderWords(); };
  $('#stc').onclick=e=>{ const b=e.target.closest('[data-st]'); if(!b) return; wf.st=b.dataset.st; wf.limit=150; renderWords(); };
  drawList();
}
function drawList(){
  const q=wf.q.trim().toLocaleLowerCase('tr');
  const res=WORDS.filter(o=>(wf.lv==='all'||o.lv===wf.lv)&&(wf.st==='all'||status(o.w)===wf.st)&&(!q||o.w.toLowerCase().includes(q)||o.tr.toLocaleLowerCase('tr').includes(q)));
  const shown=res.slice(0,wf.limit);
  $('#wl').innerHTML = `<p class="small muted" style="margin:6px 2px 0">${nf(res.length)} kelime</p>`+
    (shown.length?`<div class="list">${shown.map(o=>`<button class="item" data-w="${esc(o.w)}"><span class="dot ${status(o.w)}"></span><span class="m"><span class="w">${esc(o.w)}</span><br><span class="t">${esc(o.tr)}</span></span><span class="tag">${o.lv}</span></button>`).join('')}</div>`:'')+
    (res.length>shown.length?`<button class="btn ghost" id="more" style="margin-top:10px">Daha fazla göster</button>`:'');
  $('#wl').onclick=e=>{ const b=e.target.closest('[data-w]'); if(b) wordSheet(BY[b.dataset.w]); };
  const m=$('#more'); if(m) m.onclick=e=>{ e.stopPropagation(); wf.limit+=300; drawList(); };
}
function wordSheet(o){
  const p=S.p[o.w], st=status(o.w);
  const info = !p ? 'Henüz çalışılmadı.' : st==='learned' ? 'Öğrenildi'+(p.ld?' · '+new Date(p.ld).toLocaleDateString('tr-TR'):'')+'. Artık sorulmuyor.'
    : p.s+'. kutuda · sıradaki tekrar '+new Date(p.d).toLocaleDateString('tr-TR',{day:'numeric',month:'long'});
  sheet(`
    <div style="display:flex;align-items:center;gap:12px"><div class="grow"><div class="qword" style="font-size:32px">${esc(o.w)}</div><div class="muted">${o.pos&&POS[o.pos]?POS[o.pos]+' · ':''}${o.lv} ${LEVEL_NAME[o.lv]}</div></div><button class="say" data-say="${esc(o.w)}" aria-label="Dinle">${ICON_SAY}</button></div>
    <p style="font-size:18px;margin:14px 0 6px"><b>${esc(o.tr)}</b></p>
    ${o.ex?`<p class="ex" style="margin:0 0 4px">${exampleHtml(o)} <button class="say" style="width:32px;height:32px" data-say="${esc(o.ex)}" aria-label="Cümleyi dinle">${ICON_SAY}</button></p>`:''}
    <p class="small muted" style="margin:12px 0 16px">${esc(info)}${p?` Doğru ${p.c} · yanlış ${p.x}.`:''}</p>
    ${st!=='learned'?`<button class="btn sec" data-act="known">Bunu zaten biliyorum, öğrenildi say</button>`:''}
    ${p?`<button class="btn ghost" data-act="reset">İlerlemeyi sıfırla (yeniden öğren)</button>`:''}
    <button class="btn ghost" data-act="close">Kapat</button>`, act=>{
      if(act==='known'){ const now=Date.now(); S.p[o.w]=Object.assign(S.p[o.w]||{r:0,c:0,x:0,f:now,l:now},{s:LEARNED,d:0,ld:now,k:1}); save(); toast('“'+o.w+'” öğrenildi olarak işaretlendi'); }
      if(act==='reset'){ delete S.p[o.w]; save(); toast('Sıfırlandı'); }
      closeSheet(); render();
    });
}
const HOW_HTML = `    <p>Uygulama <b>aralıklı tekrar</b> (Leitner kutuları) kullanır: unutma eğrisine göre, bir kelimeyi tam unutmak üzereyken tekrar sorar. Her doğru cevap kelimeyi bir sonraki kutuya taşır ve sonraki soru daha geç gelir:</p>
    <ol><li>Yeni kelime: tanıtım + aynı turda test</li><li>1. kutu → 1 gün sonra</li><li>2. kutu → 3 gün sonra</li><li>3. kutu → 7 gün sonra</li><li>4. kutu → 16 gün sonra</li><li>5. kutu → 35 gün sonra (son sınav)</li></ol>
    <p>5. kutudaki sınavı da geçen kelime <b>öğrenildi</b> sayılır ve bir daha sorulmaz. Yanlış cevap kelimeyi 2 kutu geri gönderir ve aynı turda yeniden sorulur.</p>
    <p>Sorular kutuya göre zorlaşır: önce <b>çoktan seçmeli</b>, sonra <b>eksik harf tamamlama</b>, <b>cümlede boşluk doldurma</b> ve en sonda <b>elle yazma</b>. Kelimeyi tanımaktan hatırlamaya geçersin.</p>
    <p>Süre gerçek zamana göre işler: birkaç gün girmezsen tekrarlar birikir ve en gecikmiş olanlar önce gelir. Uzun aradan sonra hâlâ hatırladığın kelime bir kutu fazla atlar.</p>`;
function exportBackup(){ const b=new Blob([JSON.stringify(S)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='efam-english-yedek-'+dayKey()+'.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast('Yedek indirildi'); }
function renderSettings(){
  const s=S.set;
  const opt=(arr,v)=>arr.map(([k,l])=>`<option value="${k}" ${String(k)===String(v)?'selected':''}>${l}</option>`).join('');
  $('#view').innerHTML = `
  <section class="card">
    <div class="set"><div><b>Günlük yeni kelime</b><div class="small muted">Tekrar birikirse otomatik azalır</div></div><select id="s-daily">${opt([[5,'5'],[10,'10'],[15,'15'],[20,'20'],[30,'30'],[50,'50']],s.daily)}</select></div>
    <div class="set"><div><b>Tur uzunluğu</b><div class="small muted">Bir oturumdaki soru sayısı</div></div><select id="s-round">${opt([[10,'10'],[20,'20'],[30,'30'],[50,'50']],s.round)}</select></div>
    <div class="set"><div><b>Başlangıç seviyesi</b><div class="small muted">Yeni kelimeler bu seviyeden gelir</div></div><select id="s-start">${opt(LEVELS.map(l=>[l,l+' · '+LEVEL_NAME[l]]),s.start)}</select></div>
    <div class="set"><div><b>Otomatik seslendir</b><div class="small muted">Kelimeyi cevap sonrası okur</div></div><input type="checkbox" id="s-speak" ${s.speak?'checked':''}></div>
    <div class="set"><div><b>Tema</b></div><select id="s-theme">${opt([['auto','Sistem'],['light','Açık'],['dark','Koyu']],s.theme)}</select></div>
  </section>
  <section class="card prose">
    <h2>Nasıl çalışır?</h2>
${HOW_HTML}
  </section>
  <section class="card">
    <h2>Yedek</h2>
    <p class="small muted" style="margin:-4px 0 12px">İlerleme yalnızca bu cihazda, tarayıcı deposunda tutulur. Ara sıra yedek al.</p>
    <button class="btn sec" id="exp">Yedeği indir</button>
    <button class="btn ghost" id="imp">Yedekten geri yükle</button>
    <input type="file" id="impf" accept="application/json,.json" hidden>
    <button class="btn danger" id="wipe">Tüm ilerlemeyi sil</button>
  </section>
  <p class="small muted center"><b>eFAM English</b> · ${nf(WORDS.length)} kelime · ${LEVELS.map(l=>l+' '+BYLEVEL[l].length).join(' · ')}</p>`;
  const bind=(id,fn)=>{$(id).onchange=e=>{fn(e.target); save(); applyTheme();};};
  bind('#s-daily',t=>s.daily=+t.value); bind('#s-round',t=>s.round=+t.value); bind('#s-start',t=>s.start=t.value);
  bind('#s-speak',t=>s.speak=t.checked); bind('#s-theme',t=>s.theme=t.value);
  $('#exp').onclick=exportBackup;
  $('#imp').onclick=()=>$('#impf').click();
  $('#impf').onchange=e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(t=>{ const o=JSON.parse(t); if(!o||typeof o.p!=='object') throw 0; S=o; load2(); save(); toast('Yedek yüklendi'); render(); }).catch(()=>toast('Bu dosya geçerli bir yedek değil')); };
  $('#wipe').onclick=()=>{ if(confirm('Tüm ilerleme silinsin mi? Bu geri alınamaz.')){ const set=S.set; S=defaults(); S.set=set; save(); toast('İlerleme silindi'); render(); } };
}
function load2(){ S.set=Object.assign(defaults().set,S.set||{}); S.p=S.p||{}; S.days=S.days||{}; }
function applyTheme(){ const t=S.set.theme; if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t); }

/* ------- alt panel / bildirim ------- */
function sheet(html, onAct){
  closeSheet();
  const bg=document.createElement('div'); bg.className='sheet-bg'; bg.id='sheet';
  bg.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';
  bg.onclick=e=>{ if(e.target===bg) closeSheet(); const b=e.target.closest('[data-act]'); if(b) onAct(b.dataset.act); };
  document.body.appendChild(bg);
}
function closeSheet(){ const s=$('#sheet'); if(s) s.remove(); }
let toastT;
function toast(msg){ let t=$('.toast'); if(!t){ t=document.createElement('div'); t.className='toast'; document.body.appendChild(t); } t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2600); }

/* ================= çalışma turu ================= */
let R=null;
function startRound(extraNew, extraOnly){
  const due = extraOnly ? [] : dueList();
  const size = S.set.round;
  let nNew = extraOnly ? extraNew : Math.min(newAllowed(due.length), Math.max(size-due.length, Math.round(size*0.3)));
  const fresh = newOrder();
  nNew = Math.min(nNew, fresh.length);
  const rev = shuffle(due.slice(0, Math.max(0, size-nNew)));
  const news = fresh.slice(0,nNew);
  const q = rev.map(o=>({w:o.w, kind:'q'}));
  // yeni kelimeleri tura eşit aralıklarla yerleştir
  news.forEach((o,i)=>{ const pos=Math.round((i+1)*(q.length+news.length)/(news.length+1))-1; q.splice(Math.min(pos,q.length),0,{w:o.w,kind:'intro'}); });
  if(!q.length){ toast('Şu an çalışılacak kelime yok'); return; }
  R = {q, total:q.filter(x=>x.kind==='q').length + news.length, done:0, good:0, bad:0, learned:[], up:0, usedNew:new Set(news.map(o=>o.w)), pool:fresh.slice(nNew), last:Date.now(), extra:extraOnly};
  $('#study').hidden=false; document.body.style.overflow='hidden';
  next();
}
function tick(){ const now=Date.now(); dayRec().t += Math.min(now-R.last, 90000)/1000; R.last=now; }
function endRound(){ $('#study').hidden=true; document.body.style.overflow=''; R=null; render(); }
function head(){
  const pct = R.total ? Math.min(100, R.done/R.total*100) : 0;
  return `<div class="shead"><button class="close" id="x" aria-label="Turu bitir"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="bar"><i style="width:${pct}%;background:var(--accent)"></i></div><span class="small muted num">${R.done}/${R.total}</span></div>`;
}
function bindClose(){ $('#x').onclick=()=>{ tick(); save(); summary(); }; }
function next(){
  if(!R.q.length) return summary();
  const item=R.q.shift(); R.cur=item; const o=BY[item.w];
  if(item.kind==='intro') return intro(o,item);
  ask(o,item);
}
function intro(o,item){
  $('#sview').innerHTML = head()+`
  <div class="qkind">Yeni kelime · ${o.lv}</div>
  <div style="display:flex;align-items:center;gap:12px"><div class="qword grow">${esc(o.w)}</div><button class="say" data-say="${esc(o.w)}" aria-label="Dinle">${ICON_SAY}</button></div>
  <div class="hint">${o.pos&&POS[o.pos]?'<span class="tag">'+POS[o.pos]+'</span>':''}</div>
  <p class="qtr" style="margin:18px 0 6px">${esc(o.tr)}</p>
  ${o.ex?`<p class="ex">${exampleHtml(o)}</p>`:''}
  <div class="grow"></div>
  <div class="actions"><button class="btn" id="ok">Anladım, sor</button><button class="textlink" id="known">Bu kelimeyi zaten biliyorum</button></div>`;
  bindClose();
  if(S.set.speak) say(o.w);
  $('#ok').onclick=()=>{ tick(); R.q.splice(Math.min(3,R.q.length),0,{w:o.w,kind:'q',isNew:true}); next(); };
  $('#known').onclick=()=>{
    tick(); const now=Date.now();
    // Bilinen kelime hızlı yola alınır: 3. kutu, 7 gün sonra yazılı olarak doğrulanır.
    S.p[o.w]={s:3,d:addDays(now,7),r:0,c:0,x:0,f:now,l:now,k:1}; save();
    R.done++;
    const rep=R.pool.find(x=>!S.p[x.w]&&!R.usedNew.has(x.w));
    if(rep){ R.usedNew.add(rep.w); R.q.splice(Math.min(1,R.q.length),0,{w:rep.w,kind:'intro'}); R.total++; }
    next();
  };
}
function ask(o,item){
  const q=makeQ(o,item); R.qq=q;
  $('#sview').innerHTML = head()+`
  <div class="qkind">${KIND_LABEL[q.type]}${item.retry?' · tekrar':''}</div>
  ${q.prompt}
  ${q.input ? `<form id="f" autocomplete="off"><input class="answer" id="a" type="text" placeholder="${esc(q.ph)}" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done"></form>`
    : `<div class="choices">${q.choices.map((c,i)=>`<button class="choice" data-i="${i}">${esc(c)}</button>`).join('')}</div>`}
  <div id="fb"></div>
  <div class="grow"></div>
  <div class="actions" id="acts">${q.input?`<button class="btn" id="check">Kontrol et</button><button class="textlink" id="idk">Bilmiyorum, göster</button>`:''}</div>`;
  bindClose();
  if(q.input){
    const a=$('#a'); setTimeout(()=>a.focus(),60);
    const submit=e=>{ if(e) e.preventDefault(); if(R.answered) return; const v=a.value; if(!norm(v)){ a.focus(); return; } finish(o,item,q,checkTyped(q,v),v); };
    $('#f').onsubmit=submit; $('#check').onclick=submit;
    $('#idk').onclick=()=>{ if(!R.answered) finish(o,item,q,{r:'bad'},''); };
  } else {
    document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
      if(R.answered) return;
      const c=q.choices[+b.dataset.i]; const ok=c===q.answer;
      document.querySelectorAll('.choice').forEach(x=>{ const v=q.choices[+x.dataset.i]; if(v===q.answer) x.classList.add('ok'); else if(x===b) x.classList.add('no'); });
      finish(o,item,q,{r:ok?'good':'bad'},c);
    });
  }
  R.answered=false;
}
function finish(o,item,q,res,given){
  R.answered=true; tick();
  let moved='';
  if(!item.retry){
    moved = grade(o,res.r);
    if(res.r==='bad') R.bad++; else R.good++;
    if(moved==='learned') R.learned.push(o.w);
    if(moved==='up') R.up++;
  }
  R.done++;
  if(res.r==='bad'){
    // Yanlış bilinen kelime aynı turda birkaç soru sonra yeniden (kolay biçimde) sorulur.
    R.q.splice(Math.min(3,R.q.length),0,{w:o.w,kind:'q',retry:true});
    R.total++;
  }
  const a=$('#a'); if(a){ a.classList.add(res.r==='bad'?'no':'ok'); a.readOnly=true; a.blur(); }
  const cls = res.r==='good'?'ok':res.r==='hard'?'mid':'no';
  const title = res.r==='good' ? (moved==='learned'?'Öğrenildi! Bu kelime artık sorulmayacak.':'Doğru') : res.r==='hard' ? 'Neredeyse' : 'Yanlış';
  const p=S.p[o.w];
  const boxInfo = item.retry ? 'Pekiştirme sorusu, puanlanmadı.' : moved==='learned' ? '' : p ? (p.s+'. kutu · sonraki tekrar '+(INTERVALS[p.s]===1?'yarın':INTERVALS[p.s]+' gün sonra')) : '';
  $('#fb').innerHTML = `<div class="fb ${cls}">
    <div class="ft">${title}</div>
    ${res.note?`<div class="small" style="margin-bottom:6px">${esc(res.note)}</div>`:''}
    <div style="display:flex;align-items:center;gap:10px"><div class="grow"><b style="font-size:18px">${esc(o.w)}</b> — ${esc(o.tr)}${res.r!=='good'&&q.answer!==o.w&&q.answer!==o.tr?`<br><span class="small">Cevap: <b>${esc(q.answer)}</b></span>`:''}</div><button class="say" data-say="${esc(o.w)}" aria-label="Dinle">${ICON_SAY}</button></div>
    ${o.ex?`<div class="ex">${exampleHtml(o)}</div>`:''}
    ${boxInfo?`<div class="small muted" style="margin-top:8px">${esc(boxInfo)}</div>`:''}
  </div>`;
  $('#acts').innerHTML = `<button class="btn" id="nx">Devam</button>`;
  const nx=$('#nx'); nx.onclick=()=>next(); setTimeout(()=>nx.focus({preventScroll:true}),30);
  if(S.set.speak) say(o.w);
  if(!q.input && res.r==='good'){ const cur=R.cur; setTimeout(()=>{ if(R && R.cur===cur && R.answered) next(); }, 1300); }
}
function summary(){
  if(!R) return;
  const tot=R.good+R.bad;
  const due=dueList().length, more = due + Math.min(newAllowed(due), counts().fresh);
  $('#sview').innerHTML = `
  <div class="center" style="margin-top:8vh">
    <div class="celebrate">${R.learned.length?'🎓':tot&&R.bad===0?'🌟':'✅'}</div>
    <h1 style="font-size:28px">Tur bitti</h1>
    <p class="muted">${tot} cevap · %${tot?Math.round(R.good/tot*100):0} doğru</p>
  </div>
  <div class="row" style="margin:18px 0">
    <div class="tile"><b class="num">${R.good}</b><span>doğru</span></div>
    <div class="tile"><b class="num">${R.bad}</b><span>yanlış</span></div>
    <div class="tile"><b class="num">${R.learned.length}</b><span>öğrenildi</span></div>
  </div>
  ${R.learned.length?`<div class="card"><b>Artık sorulmayacak kelimeler</b><p style="margin:6px 0 0">${R.learned.map(esc).join(', ')}</p></div>`:''}
  <div class="grow"></div>
  ${more && !R.extra?`<button class="btn" id="again">Yeni tur · ${Math.min(more,S.set.round)} soru</button>`:''}
  <button class="btn ${more&&!R.extra?'ghost':''}" id="home">Ana sayfaya dön</button>`;
  save();
  const ag=$('#again'); if(ag) ag.onclick=()=>{ startRound(0); };
  $('#home').onclick=endRound;
}
document.addEventListener('keydown', e=>{
  if(!R || $('#study').hidden) return;
  if(e.key==='Enter' && R.answered){ const nx=$('#nx'); if(nx && document.activeElement!==nx){ e.preventDefault(); nx.click(); } }
  if(!R.answered && R.qq && !R.qq.input && /^[1-4]$/.test(e.key)){ const b=document.querySelector('.choice[data-i="'+(+e.key-1)+'"]'); if(b) b.click(); }
});

/* test/hata ayıklama kancası */
window.__kelime = { answer: () => R && R.qq ? R.qq.answer : null, type: () => R && R.qq ? R.qq.type : null };

/* ================= başlat ================= */
load(); applyTheme();
loadWords().then(()=>{ render(); }).catch(err=>{ $('#view').innerHTML='<div class="card"><b>Kelime listesi yüklenemedi.</b><p class="muted small">Uygulamayı bir web sunucusu üzerinden aç (dosyayı doğrudan açınca tarayıcı veri dosyalarını okuyamaz). '+esc(err.message)+'</p></div>'; });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && !R && WORDS.length) render(); });
if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
